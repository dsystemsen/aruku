<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="aruku OGP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f6f2e6"/>
      <stop offset="1" stop-color="#efe9d8"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa86b"/>
      <stop offset="1" stop-color="#1b5e3f"/>
    </linearGradient>
    <style>
      .serif { font-family: Georgia, "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif; }
      .sans  { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 等高線（地形図） -->
  <g stroke="#34915f" stroke-width="2.5" fill="none" opacity="0.16">
    <path d="M820 -40 Q1000 120 880 300 T980 640"/>
    <path d="M900 -40 Q1080 130 960 320 T1060 640"/>
    <path d="M980 -40 Q1160 140 1040 340 T1140 640"/>
  </g>
  <!-- 点線の小道 -->
  <path d="M80 560 C 260 520, 240 420, 420 400 S 700 360, 760 250" fill="none"
        stroke="#c2541f" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 22" opacity="0.7"/>
  <!-- ロゴバッジ -->
  <rect x="92" y="116" width="118" height="118" rx="30" fill="url(#badge)"/>
  <circle cx="162" cy="156" r="11" fill="#fff"/>
  <path d="M157 172 L145 198 L130 208" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M145 198 L158 216 L154 236" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M145 198 L130 188 L115 194" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M157 174 L168 180" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- ワードマーク -->
  <text x="232" y="212" class="serif" font-size="104" font-weight="700" fill="#103620">aruku</text>
  <!-- 見出し -->
  <text x="94" y="372" class="serif" font-size="72" font-weight="700" fill="#16241b">歩くことを、もっと楽しく健康に。</text>
  <!-- サブ -->
  <text x="96" y="452" class="sans" font-size="37" fill="#38473d">ウォーキングの効果・正しい歩き方・歩数別カロリー</text>
  <text x="96" y="506" class="sans" font-size="37" fill="#38473d">歩いてポイ活・ウォーキングマシンまで徹底解説</text>
  <!-- ドメイン -->
  <text x="94" y="588" class="serif" font-size="30" font-weight="600" fill="#c2541f" letter-spacing="1">aruku.dsystemsen.com</text>
</svg>
